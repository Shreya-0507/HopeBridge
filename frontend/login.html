<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nasha Mukti - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">


            <!-- LOGIN HEADING -->

            <div class="auth-heading">

                <span class="auth-eyebrow">
                    WELCOME BACK
                </span>

                <h2>
                    Login to your account
                </h2>

                <p>
                    Continue your journey towards a healthier,
                    happier and drug-free life.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="auth-field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Login →

                </button>


                <p class="auth-switch">

                    Don't have an account?

                    <a href="index.html">
                        Create Account
                    </a>

                </p>

            </form>


            <p
                id="message"
                class="auth-message">
            </p>


            <!-- FOOTER MESSAGE -->

            <div class="auth-footer">

                <span>💚</span>

                <p>
                    Every step toward a healthier life matters.
                </p>

            </div>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
